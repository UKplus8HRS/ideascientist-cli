[project]
name = "ideascientist"
version = "0.1.0"
description = "Standalone IdeaScientist harness. The coordinator is code; the model is reached through Magpie."
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
dependencies = ["pypdf>=5"]

[project.scripts]
ideascientist = "ideascientist.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
